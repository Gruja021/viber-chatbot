# Production Docker Compose
# Usage: docker compose -f docker-compose.prod.yml up -d
# Requires: .env file with all required secrets (see .env.example)

services:
  postgres:
    image: pgvector/pgvector:pg16
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB:-viber_chatbot}
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER}"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - internal

  redis:
    image: redis:7-alpine
    restart: unless-stopped
    command: redis-server --notify-keyspace-events Ex --requirepass ${REDIS_PASSWORD}
    volumes:
      - redisdata:/data
    healthcheck:
      test: ["CMD", "redis-cli", "-a", "${REDIS_PASSWORD}", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - internal

  app:
    build: .
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    environment:
      NODE_ENV: production
      PORT: 3000
      DATABASE_URL: postgresql://${POSTGRES_USER}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB:-viber_chatbot}
      REDIS_URL: redis://:${REDIS_PASSWORD}@redis:6379
      ADMIN_API_TOKEN: ${ADMIN_API_TOKEN}
      ENCRYPTION_KEY: ${ENCRYPTION_KEY}
      WEBHOOK_BASE_URL: ${WEBHOOK_BASE_URL}
      OPENAI_API_KEY: ${OPENAI_API_KEY}
      CHATWOOT_BASE_URL: http://chatwoot-rails:3000
      CHATWOOT_PLATFORM_TOKEN: ${CHATWOOT_PLATFORM_TOKEN:-}
      CHATWOOT_WEBHOOK_SECRET: ${CHATWOOT_WEBHOOK_SECRET:-}
      CORS_ORIGIN: ${CORS_ORIGIN}
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://localhost:3000/health || exit 1"]
      interval: 15s
      timeout: 5s
      retries: 10
      start_period: 20s
    networks:
      - internal
    expose:
      - "3000"

  chatwoot-rails:
    image: chatwoot/chatwoot:v4.0.2
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    environment:
      RAILS_ENV: production
      SECRET_KEY_BASE: ${CHATWOOT_SECRET_KEY_BASE}
      FRONTEND_URL: ${CHATWOOT_FRONTEND_URL}
      ACTION_CABLE_URL: ${ACTION_CABLE_URL:-}
      FORCE_SSL: "false"
      DATABASE_URL: postgresql://${POSTGRES_USER}:${POSTGRES_PASSWORD}@postgres:5432/chatwoot
      REDIS_URL: redis://:${REDIS_PASSWORD}@redis:6379
      RAILS_LOG_TO_STDOUT: "true"
    entrypoint: /bin/sh
    command: >
      -c "rm -f /app/tmp/pids/server.pid && bundle exec rails db:chatwoot_prepare && bundle exec rails s -b 0.0.0.0 -p 3000"
    ports:
      - "3001:3000"
    networks:
      - internal

  chatwoot-sidekiq:
    image: chatwoot/chatwoot:v4.0.2
    restart: unless-stopped
    depends_on:
      - chatwoot-rails
    environment:
      RAILS_ENV: production
      SECRET_KEY_BASE: ${CHATWOOT_SECRET_KEY_BASE}
      FRONTEND_URL: ${CHATWOOT_FRONTEND_URL}
      ACTION_CABLE_URL: ${ACTION_CABLE_URL:-}
      FORCE_SSL: "false"
      DATABASE_URL: postgresql://${POSTGRES_USER}:${POSTGRES_PASSWORD}@postgres:5432/chatwoot
      REDIS_URL: redis://:${REDIS_PASSWORD}@redis:6379
    command: bundle exec sidekiq -C config/sidekiq.yml
    networks:
      - internal

  nginx:
    image: nginx:alpine
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/nginx.conf:ro
      - ./nginx/ssl:/etc/nginx/ssl:ro
      - ./admin/dist/admin/browser:/usr/share/nginx/html:ro
    depends_on:
      - app
    networks:
      - internal

volumes:
  pgdata:
  redisdata:

networks:
  internal:
    driver: bridge
