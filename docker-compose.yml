services:
  postgres:
    image: pgvector/pgvector:pg16
    environment:
      POSTGRES_USER: viber_chatbot
      POSTGRES_PASSWORD: viber_chatbot_pass
      POSTGRES_DB: viber_chatbot
    ports:
      - "5433:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U viber_chatbot"]
      interval: 5s
      timeout: 3s
      retries: 5

  redis:
    image: redis:7-alpine
    command: redis-server --notify-keyspace-events Ex
    ports:
      - "6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 5

  app:
    build: .
    ports:
      - "3000:3000"
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    environment:
      NODE_ENV: production
      PORT: 3000
      DATABASE_URL: postgresql://viber_chatbot:viber_chatbot_pass@postgres:5432/viber_chatbot
      REDIS_URL: redis://redis:6379
      ADMIN_API_TOKEN: ${ADMIN_API_TOKEN:-change-me-in-production}
      ENCRYPTION_KEY: ${ENCRYPTION_KEY:-0123456789abcdef0123456789abcdef0123456789abcdef0123456789abcdef}
      WEBHOOK_BASE_URL: ${WEBHOOK_BASE_URL:-http://localhost:3000}
      OPENAI_API_KEY: ${OPENAI_API_KEY:-}
      CHATWOOT_BASE_URL: http://chatwoot-rails:3000
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://localhost:3000/health || exit 1"]
      interval: 5s
      timeout: 3s
      retries: 10
      start_period: 15s

  chatwoot-rails:
    image: chatwoot/chatwoot:v4.0.2
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    ports:
      - "3001:3000"
    environment:
      RAILS_ENV: production
      SECRET_KEY_BASE: replace_with_lengthy_secure_hex_string_at_least_64_chars_long_1234567890abcdef
      FRONTEND_URL: http://localhost:3001
      DATABASE_URL: postgresql://viber_chatbot:viber_chatbot_pass@postgres:5432/chatwoot
      REDIS_URL: redis://redis:6379
      RAILS_LOG_TO_STDOUT: "true"
    entrypoint: /bin/sh
    command: >
      -c "bundle exec rails db:chatwoot_prepare && bundle exec rails s -b 0.0.0.0 -p 3000"

  chatwoot-sidekiq:
    image: chatwoot/chatwoot:v4.0.2
    depends_on:
      - chatwoot-rails
    environment:
      RAILS_ENV: production
      SECRET_KEY_BASE: replace_with_lengthy_secure_hex_string_at_least_64_chars_long_1234567890abcdef
      FRONTEND_URL: http://localhost:3001
      DATABASE_URL: postgresql://viber_chatbot:viber_chatbot_pass@postgres:5432/chatwoot
      REDIS_URL: redis://redis:6379
    command: bundle exec sidekiq -C config/sidekiq.yml

volumes:
  pgdata:
